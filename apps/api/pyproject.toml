[project]
name = "third-brain-api"
dynamic = ["version"]
description = "Third Brain - company-wide LLM-agnostic knowledge layer (API)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pgvector>=0.2.5",
    "redis>=5.0",
    "arq>=0.25",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "httpx>=0.27",
    "tiktoken>=0.6",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "signxml>=3.2",
    "boto3>=1.34",
    "structlog>=24.1",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "opentelemetry-instrumentation-redis>=0.50b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # Pinned exact: ruff's formatter output changes between releases, so a floating spec makes
    # `ruff format --check` in CI fail whenever a new ruff ships a formatting change, even with
    # no code change. Bump this deliberately (and reformat) rather than letting CI drift.
    "ruff==0.15.20",
]
load = [
    "locust>=2.29",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",   # FastAPI uses function calls (Depends) in argument defaults
    "UP042",  # `class X(str, Enum)` is intentional (stable str() + JSON semantics)
    "SIM105", # `try/except/pass` is clear enough for best-effort cleanup blocks
    "SIM117", # nested `async with` is idiomatic for httpx streaming clients
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
# Put the apps/api root on sys.path so the non-installed sibling packages that are
# exercised by tests (loadtests, benchmarks) import under a bare ``pytest`` invocation,
# not only under ``python -m pytest``.
pythonpath = ["."]
markers = [
    "integration: end-to-end tests that require a live Postgres+pgvector and Redis (self-skip when unreachable)",
    "e2e: full-stack browser/Playwright end-to-end tests (run outside pytest)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]
