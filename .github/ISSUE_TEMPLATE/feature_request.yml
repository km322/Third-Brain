name: Feature request
description: Suggest a capability or an improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should Third Brain do instead? Sketch the surface (route, dashboard page, MCP tool, CLI command) if you have one in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, or the workaround you use now.
    validations:
      required: false

  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to contribute this?
      options:
        - Yes, I would like to open a PR
        - Maybe, with some guidance on the approach
        - No, I am just proposing it
    validations:
      required: true
