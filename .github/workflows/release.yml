name: Release

# Cut a release from a `vX.Y.Z` tag (pushed by `make release VERSION=X.Y.Z`):
#   * verify the tag matches the repo's version literals and that CI already
#     passed on the tagged commit,
#   * publish the third-brain-mcp CLI to npm via OIDC trusted publishing,
#   * build + push multi-arch api/web images to GHCR tagged vX.Y.Z and latest,
#   * publish a GitHub release with the matching CHANGELOG section as notes.
#
# A tag-push run executes the workflow AS OF THE TAGGED COMMIT. To re-run a
# release for an existing tag with the current workflow definition (e.g. after
# fixing this file), use the manual trigger: Actions -> Release -> Run workflow
# (or `gh workflow run release.yml -f tag=vX.Y.Z`). Every job checks out and
# builds the tagged commit either way.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to (re-)release"
        required: true

# Least privilege by default; each job widens only what it needs. Every job here runs
# third-party docker/* actions, so a compromised action must not inherit the ability to
# push to the repository or overwrite published images.
permissions:
  contents: read

# One fixed group so ALL release runs serialize: a half-finished release is
# never cancelled, and a tag pushed mid-build waits its turn instead of racing
# the shared :latest image tag (GitHub keeps the newest pending run per group).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------- #
  # Gate: tag == VERSION == every other version literal, and CI is green on main.
  #
  # Runs in the `release` environment, which waits for a maintainer's approval, so a
  # pushed tag alone publishes nothing: every image push and the GitHub release depend
  # on this job. npm-publish has its own approval as well (see below).
  # --------------------------------------------------------------------------- #
  verify:
    name: Verify tag, versions and CI status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      actions: read   # query the CI run status for the tagged commit
    outputs:
      version: ${{ steps.meta.outputs.version }}
      owner: ${{ steps.meta.outputs.owner }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      # A manual run must name a release tag, not a branch or a SHA: without this, any ref
      # whose VERSION file matches could be published as a release.
      - name: Require a vX.Y.Z tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          tag="${TAG_INPUT:-$GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$tag' is not a vX.Y.Z release tag."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tag pushes check out the tag by default; manual runs must ask for it. The
          # explicit refs/tags/ prefix keeps a same-named branch from being checked out.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Check the tag against the repo version literals
        id: meta
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          tag="${TAG_INPUT:-$GITHUB_REF_NAME}"
          version="${tag#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$version" != "$file_version" ]; then
            echo "::error::Tag $tag does not match the VERSION file ($file_version). Cut releases with 'make release VERSION=$version' so the tag and version literals move together."
            exit 1
          fi
          ./scripts/check_version_sync.sh
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Only main's history is releasable, and only a CI run from a push to main counts:
      # a pull_request run is green for code main's branch protection never admitted.
      - name: Require the tagged commit on main with green CI
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          on_main="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$SHA" -q '.status')"
          if [ "$on_main" != "behind" ] && [ "$on_main" != "identical" ]; then
            echo "::error::$SHA is not on main (compare status: $on_main). Release only commits that have landed on main."
            exit 1
          fi
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&status=completed" -q '.workflow_runs[0].conclusion')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI has not passed on $SHA (found: ${conclusion:-no completed run}). Let CI go green on main for this commit, then re-run this workflow."
            exit 1
          fi

  # --------------------------------------------------------------------------- #
  # Publish the third-brain-mcp CLI to npm via OIDC trusted publishing - no
  # token, secret, or OTP involved. One-time setup: on npmjs.com the package's
  # Settings -> Trusted Publisher must list this repo and this workflow file.
  #
  # Runs LAST, after the images are merged and verified, because it is the only
  # irreversible step in the release: a published npm version can never be reused,
  # so publishing it before the image build could leave the CLI live at a version
  # that has no images and no GitHub release, recoverable only by burning a version.
  #
  # Gated by the `npm` environment, which requires a maintainer's approval before the
  # job starts and is bound in the npm Trusted Publisher settings. The approval lives on
  # this job, not only on verify, because npm trusts any run of this workflow file in
  # that environment: a tag on a commit that edits release.yml could drop the verify
  # gate, but not an environment's protection rules.
  # --------------------------------------------------------------------------- #
  npm-publish:
    name: Publish third-brain-mcp to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify, merge-manifests]
    environment: npm
    permissions:
      contents: read
      id-token: write # mint the OIDC token npm exchanges for publish credentials
    defaults:
      run:
        working-directory: packages/mcp-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit verify approved, not the tag: a tag moved mid-release must not
          # put unverified code into the published artifacts.
          ref: ${{ needs.verify.outputs.sha }}

      # Trusted publishing needs npm >= 11.5.1. Node 24 bundles it, so nothing is fetched
      # from the registry into the job that holds the publish credential.
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          # No dependency cache in the job that holds the publish credential: a cache
          # written by another run must never be restored here.
          package-manager-cache: false

      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          # Idempotent: a re-run of a partially-failed release must not abort on an
          # already-published version (EPUBLISHCONFLICT). Skip when this exact version
          # is already on the registry.
          if npm view "third-brain-mcp@${version}" version >/dev/null 2>&1; then
            echo "third-brain-mcp@${version} is already published - skipping."
          else
            # --provenance makes a missing attestation a failed publish, not a silent one.
            npm publish --provenance
          fi

  # --------------------------------------------------------------------------- #
  # Build each architecture on its OWN native runner, push by digest, then merge
  # the digests into one multi-arch tag.
  #
  # This used to be a single job building linux/amd64,linux/arm64 together under
  # QEMU. That is why it is now split: emulating the arm64 leg was both unreliable
  # and slow. It died with SIGILL mid-build (2026-07-27), and once that was pinned
  # around it still took over 30 minutes and timed out the release three times on
  # 2026-09-07. GitHub gives public repositories free native arm64 runners, so the
  # emulation is unnecessary - each leg now runs on real hardware in a few minutes.
  # --------------------------------------------------------------------------- #
  build-push:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs: verify
    permissions:
      contents: read
      packages: write   # push the per-architecture image to GHCR
    strategy:
      fail-fast: false
      matrix:
        image: [third-brain-api, third-brain-web]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: third-brain-api
            context: apps/api
          - image: third-brain-web
            context: apps/web
            # NEXT_PUBLIC_* is inlined at build time - bake the public API origin.
            # Set the RELEASE_NEXT_PUBLIC_API_URL repository variable for real deploys.
            extra_build_args: NEXT_PUBLIC_API_URL=${{ vars.RELEASE_NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit verify approved, not the tag: a tag moved mid-release must not
          # put unverified code into the published artifacts.
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record build time
        id: build_time
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: ${{ matrix.platform }}
          # No provenance attestation: it adds unknown/unknown manifest entries
          # that confuse `docker pull` by digest and GHCR's package UI.
          provenance: false
          # Push the untagged single-arch image; the merge job below applies the
          # real tags to a manifest list built from these digests.
          outputs: type=image,name=ghcr.io/${{ needs.verify.outputs.owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION=${{ needs.verify.outputs.version }}
            GIT_COMMIT=${{ needs.verify.outputs.sha }}
            BUILD_TIME=${{ steps.build_time.outputs.build_time }}
            ${{ matrix.extra_build_args }}
          cache-from: type=gha,scope=release-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=release-${{ matrix.image }}-${{ matrix.arch }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          # The filename is the digest with the `sha256:` prefix stripped:
          # upload-artifact rejects a colon in a path. The merge job puts it back.
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # --------------------------------------------------------------------------- #
  # Combine the per-architecture digests into one multi-arch tag per image.
  # --------------------------------------------------------------------------- #
  merge-manifests:
    name: Merge ${{ matrix.image }} manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify, build-push]
    permissions:
      contents: read
      packages: write   # push the multi-arch image index to GHCR
    strategy:
      matrix:
        image: [third-brain-api, third-brain-web]
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the manifest list
        working-directory: /tmp/digests
        env:
          REPO: ghcr.io/${{ needs.verify.outputs.owner }}/${{ matrix.image }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # One file per architecture, named after its digest with the `sha256:`
          # prefix stripped, so both legs must have landed before we tag.
          count=$(ls -1 | wc -l)
          if [ "$count" -lt 2 ]; then
            echo "::error::expected 2 digests for $REPO, found $count"
            exit 1
          fi
          docker buildx imagetools create \
            -t "$REPO:v$VERSION" \
            -t "$REPO:latest" \
            $(printf "$REPO@sha256:%s " *)

      - name: Verify the published manifest
        env:
          REPO: ghcr.io/${{ needs.verify.outputs.owner }}/${{ matrix.image }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          docker buildx imagetools inspect "$REPO:v$VERSION"
          # Both architectures must be present, or a self-hoster on one of them
          # silently gets no image. Parse the index as JSON rather than grepping
          # it: `--raw` pretty-prints, so a compact-JSON pattern never matches.
          raw="$(docker buildx imagetools inspect --raw "$REPO:v$VERSION")"
          for arch in amd64 arm64; do
            printf '%s' "$raw" | jq -e --arg a "$arch" \
              'any(.manifests[]?; .platform.os == "linux" and .platform.architecture == $a)' >/dev/null \
              || { echo "::error::$REPO:v$VERSION is missing linux/$arch"; exit 1; }
          done

  # --------------------------------------------------------------------------- #
  # GitHub release with the CHANGELOG section for this version as the notes.
  # --------------------------------------------------------------------------- #
  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify, merge-manifests]
    permissions:
      contents: write   # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit verify approved, not the tag: a tag moved mid-release must not
          # put unverified code into the published artifacts.
          ref: ${{ needs.verify.outputs.sha }}

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        # index() string matching, not a regex: version dots and [] stay literal.
        # Stops at the next "## [" header or at the link-reference block.
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { grab = 1; next }
            grab && index($0, "## [") == 1 { exit }
            grab && index($0, "[") == 1 && index($0, "]: http") > 0 { exit }
            grab { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::No '## [$VERSION]' section with content found in CHANGELOG.md"
            exit 1
          fi

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        # Idempotent so a re-run (e.g. after the verify guard raced a still-running CI)
        # updates the existing release instead of failing on "tag_name already exists".
        run: |
          if gh release view "$TAG" --json name > /dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Third Brain $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" \
              --title "Third Brain $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag
          fi
