name: CI

# Quality gates for Third Brain. On every push/PR we:
#   * lint + format-check the backend and the Next.js frontend,
#   * run the FULL pytest suite (unit + integration) against a REAL
#     Postgres 16 + pgvector and REAL Redis after `alembic upgrade head`
#     - this job is the AUTHORITATIVE test gate,
#   * build the api + web Docker images to catch Dockerfile regressions,
#   * drive the whole docker-compose stack through Playwright end-to-end, and
#   * run the REAL one-command self-host bring-up (`scripts/selfhost-init.sh`,
#     what `make selfhost` invokes) and assert the deployment it produces works.
#
# There is intentionally NO hermetic / SQLite / mock tier: the real-infra
# job below is the single source of truth for correctness.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs to save CI minutes - but only within a pull request. Pushes to
# main are grouped by commit SHA so they never cancel each other: release.yml gates on the
# CI run for the tagged commit having concluded `success`, and a run cancelled by the next
# push to main concludes `cancelled`, which would block the release with no way to make it
# green short of re-running CI by hand.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------- #
  # Version consistency: every version literal (VERSION, __init__.py,
  # package.json, ROADMAP) must agree - the release workflow depends on it.
  # --------------------------------------------------------------------------- #
  version-sync:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check version literals are in sync
        run: ./scripts/check_version_sync.sh

  # --------------------------------------------------------------------------- #
  # Backend lint: ruff check + ruff format --check (matches `make lint`/`make fmt`).
  # --------------------------------------------------------------------------- #
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

  # --------------------------------------------------------------------------- #
  # Backend tests (AUTHORITATIVE): real Postgres+pgvector + real Redis.
  # Unit + integration both run here; integration tests self-skip only when the
  # env vars are absent, so on CI (where they ARE set) they MUST execute.
  # --------------------------------------------------------------------------- #
  backend-tests:
    name: Backend tests (pgvector + redis)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: thirdbrain
          POSTGRES_PASSWORD: thirdbrain
          POSTGRES_DB: thirdbrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thirdbrain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # `DATABASE_URL` drives BOTH the app engine and `alembic upgrade head`
      # (alembic swaps +asyncpg -> +psycopg internally). The TEST_* aliases are
      # what the test conftest resolves against (TEST_* or plain).
      DATABASE_URL: postgresql+asyncpg://thirdbrain:thirdbrain@localhost:5432/thirdbrain
      TEST_DATABASE_URL: postgresql+asyncpg://thirdbrain:thirdbrain@localhost:5432/thirdbrain
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/0
      # Force the deterministic offline LLM provider - tests never hit a network.
      EMBEDDING_PROVIDER: fake
      SECRET_KEY: ci-test-secret-key-not-for-production
      ENVIRONMENT: development
      # Infra IS provided here, so the integration tier must RUN, not self-skip: make the
      # reachability gate fail (not skip) if Postgres/Redis are unreachable, so a probe
      # regression can't silently turn this authoritative job into unit-tests-only.
      REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Verify migrations are reversible (downgrade base -> upgrade head)
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Run tests (unit + integration) with coverage
        run: pytest -q --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: apps/api/coverage.xml
          if-no-files-found: warn

  # --------------------------------------------------------------------------- #
  # Frontend: install, lint, format-check and production-build the Next.js app.
  # --------------------------------------------------------------------------- #
  frontend:
    # NOTE: this name is a required status check in branch protection on main. Renaming it
    # silently blocks every PR (the old context is never reported again), so change it only
    # together with the protection rule.
    name: Frontend (lint + format + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Build
        run: npm run build

      # This is the exact command Cloudflare Pages runs to publish third-brain.ai.
      # Without it here, a page missing from the PUBLISHED_PAGES allowlist - or any
      # component that cannot be statically exported - passes CI and only fails at
      # the host, taking the public site's build down with no signal in the repo.
      - name: Build static project site
        run: npm run build:site

  # --------------------------------------------------------------------------- #
  # MCP CLI: lint + unit-test the zero-dependency third-brain-mcp package.
  # --------------------------------------------------------------------------- #
  mcp-cli:
    name: MCP CLI (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/mcp-cli
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/mcp-cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The package declares `engines: {"node": ">=18"}` and its npm page promises
      # "Node 18 or newer", so the floor has to be exercised or the promise is
      # unverified - `node --test` on 22 happily accepts APIs that throw on 18.
      # Done as extra steps in this job rather than a matrix because the job name is
      # a required status check on main; a matrix would rename it and block every PR.
      - name: Set up Node 18 (the supported floor)
        uses: actions/setup-node@v6
        with:
          node-version: "18"

      - name: Test on Node 18
        run: npm test

  # --------------------------------------------------------------------------- #
  # Docker images: buildx-build the api + web images to catch Dockerfile drift.
  # --------------------------------------------------------------------------- #
  docker-build:
    name: Docker build (api + web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Validate prod compose image interpolation
        # The release workflow publishes ${IMAGE_REGISTRY}/third-brain-*:${IMAGE_TAG};
        # make sure docker-compose.prod.yml resolves those refs correctly both with
        # and without a registry prefix (and never emits a leading-slash artifact).
        run: |
          cp .env.example .env
          plain="$(docker compose -f docker-compose.prod.yml config --images)"
          if ! echo "$plain" | grep -qxF 'third-brain-api:latest' \
            || ! echo "$plain" | grep -qxF 'third-brain-web:latest' \
            || echo "$plain" | grep -q '^/'; then
            echo "::error::Unexpected image refs with IMAGE_REGISTRY unset"
            echo "$plain"
            exit 1
          fi
          tagged="$(IMAGE_REGISTRY=ghcr.io/km322 IMAGE_TAG=v9.9.9 docker compose -f docker-compose.prod.yml config --images)"
          if ! echo "$tagged" | grep -qxF 'ghcr.io/km322/third-brain-api:v9.9.9' \
            || ! echo "$tagged" | grep -qxF 'ghcr.io/km322/third-brain-web:v9.9.9'; then
            echo "::error::Unexpected image refs with IMAGE_REGISTRY=ghcr.io/km322 IMAGE_TAG=v9.9.9"
            echo "$tagged"
            exit 1
          fi
          rm -f .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: false
          load: false
          tags: third-brain-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: false
          load: false
          tags: third-brain-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # --------------------------------------------------------------------------- #
  # The same two images on arm64. The release publishes a two-architecture manifest
  # and hard-fails if either leg is missing, but the job above builds only the
  # runner's native amd64 - so an arm64-only break (a dependency with no aarch64
  # wheel, a base tag with no arm64 variant) passed CI and first surfaced mid-release.
  # A native runner, not QEMU: emulated arm64 builds died with SIGILL and then timed
  # out three times on 2026-09-07, which is why the release moved off them.
  #
  # Separate job rather than a matrix on docker-build, because that job's name is a
  # required status check on main and a matrix would rename it, blocking every PR.
  # Add "Docker build (arm64)" to the required contexts to make this an enforced gate.
  # --------------------------------------------------------------------------- #
  docker-build-arm64:
    name: Docker build (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image (arm64)
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: false
          load: false
          tags: third-brain-api:ci-arm64
          cache-from: type=gha,scope=api-arm64
          cache-to: type=gha,scope=api-arm64,mode=max

      - name: Build web image (arm64)
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: false
          load: false
          tags: third-brain-web:ci-arm64
          cache-from: type=gha,scope=web-arm64
          cache-to: type=gha,scope=web-arm64,mode=max

  # --------------------------------------------------------------------------- #
  # End-to-end: boot the real docker-compose stack and drive it with Playwright.
  # --------------------------------------------------------------------------- #
  e2e:
    name: E2E (compose + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-lint, frontend]
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      # The data-sources journey creates a local folder on the runner and points the
      # containerised connector at it, so it must resolve to the same absolute path on
      # both sides. This dir is bind-mounted into api + worker by docker-compose.e2e.yml.
      E2E_DATA_DIR: /tmp/tb-e2e-data
      # Make every `docker compose` invocation in this job apply the e2e overlay.
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v7

      - name: Provision .env
        run: cp .env.example .env

      # Install the runner-side Playwright toolchain BEFORE starting the stack. The dev
      # compose bind-mounts ./apps/web with an anonymous node_modules volume, so
      # `docker compose up` would otherwise create apps/web/node_modules on the host as
      # root (the volume mountpoint), and the subsequent `npm ci` would fail with EACCES.
      # Creating node_modules here first (owned by the runner) means Docker mounts onto the
      # existing directory instead of creating a root-owned one.
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Create the shared data-source directory
        # World-writable so both the runner (writing test files) and the appuser (uid
        # 10001) inside the containers (reading them) can use it.
        run: mkdir -p "$E2E_DATA_DIR" && chmod 777 "$E2E_DATA_DIR"

      - name: Build and start the full stack
        run: docker compose up -d --build

      - name: Wait for the API to report healthy
        run: |
          echo "Polling http://localhost:8000/api/v1/health ..."
          for i in $(seq 1 60); do
            body="$(curl -fsS http://localhost:8000/api/v1/health || true)"
            echo "attempt $i: ${body:-<no response>}"
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "API is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "::error::API did not become healthy in time"
          exit 1

      - name: Apply database migrations
        # The dev compose stack has no migrate one-shot and the app never
        # auto-creates the schema, so migrate the freshly-started DB before the
        # Playwright journeys (signup, etc.) write to it. Mirrors `make migrate`.
        run: docker compose exec -T api alembic upgrade head

      - name: Wait for the web app to answer
        run: |
          echo "Polling http://localhost:3000 ..."
          for i in $(seq 1 60); do
            code="$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:3000 || true)"
            echo "attempt $i: HTTP ${code:-000}"
            if [ "$code" = "200" ]; then
              echo "Web is up."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Web app did not become reachable in time"
          exit 1

      - name: Run Playwright end-to-end tests
        working-directory: apps/web
        run: npm run test:e2e

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v

  # --------------------------------------------------------------------------- #
  # Self-host: the supported way the product actually ships. This runs the REAL
  # entry point (`scripts/selfhost-init.sh`, i.e. `make selfhost`) against the
  # production compose topology - its .env generation, its health wait and its
  # `compose exec` bootstrap - then asserts the resulting deployment works rather
  # than merely that the script exited 0.
  #
  # The images are BUILT from source here: .env.example leaves IMAGE_REGISTRY and
  # IMAGE_TAG empty, so the prod compose resolves unqualified
  # third-brain-api:latest / third-brain-web:latest and `up -d --build` builds
  # them. The published GHCR packages are public and pullable, but they are the
  # PREVIOUS release - pulling them would silently test a stale image instead of
  # the commit under CI.
  # --------------------------------------------------------------------------- #
  selfhost:
    name: Self-host (prod compose + bootstrap)
    runs-on: ubuntu-latest
    # The init script alone waits up to 300s for health, twice, on top of two
    # cold-cache image builds (api venv + Next.js production build).
    timeout-minutes: 45
    needs: [backend-lint, frontend]
    env:
      # Make every `docker compose` invocation in this job address the same project the
      # init script brings up. The script passes its own -f flags, which take precedence
      # over this, so setting it here cannot change what the script does.
      COMPOSE_FILE: docker-compose.prod.yml:docker-compose.selfhost.yml
      # `make selfhost` reads the admin address from the environment; this is exactly
      # `ADMIN_EMAIL=ci@example.com ./scripts/selfhost-init.sh`.
      ADMIN_EMAIL: ci@example.com
      # The selfhost overlay publishes these on loopback by default (no --host given).
      # Addressing them by literal IPv4 avoids depending on how `localhost` resolves.
      API_BASE: http://127.0.0.1:8000/api/v1
      WEB_BASE: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7

      - name: Check the stack will build from source, not pull GHCR
        run: |
          if ! grep -qxF 'IMAGE_REGISTRY=' .env.example || ! grep -qxF 'IMAGE_TAG=' .env.example; then
            echo "::error::.env.example must leave IMAGE_REGISTRY and IMAGE_TAG empty so this job builds the images from source; a registry prefix would make it pull the previous release's GHCR images instead of testing this commit"
            exit 1
          fi

      - name: Generate and mask the bootstrap admin password
        # `bootstrap_admin` reads ADMIN_PASSWORD from the api container's environment, which
        # docker-compose.prod.yml populates via `env_file: .env` - the file the init script
        # generates from .env.example. Seeding it into the template is how an operator picks
        # their own password, and it means the sign-in assertion below never has to scrape
        # the credentials out of the script's stdout. 48 hex chars satisfies the 8-128 policy.
        # The mask is registered BEFORE the value is written anywhere the runner echoes.
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          echo "ADMIN_PASSWORD=${password}" >> "$GITHUB_ENV"
          printf 'ADMIN_PASSWORD=%s\n' "$password" >> .env.example

      - name: Run the self-host installer (make selfhost)
        run: ./scripts/selfhost-init.sh

      - name: Assert the API reports database and redis healthy
        # The installer probes health from INSIDE the container, so it stays green even if
        # the selfhost overlay fails to publish the port. Probe the published port instead:
        # that is the endpoint an operator (and the browser) actually reaches.
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          with urllib.request.urlopen(os.environ["API_BASE"] + "/health", timeout=15) as resp:
              status, body = resp.status, json.load(resp)
          print(f"HTTP {status} {json.dumps(body)}")
          checks = body.get("checks", {})
          if (
              status != 200
              or body.get("status") != "ok"
              or checks.get("database") is not True
              or checks.get("redis") is not True
          ):
              print("::error::/api/v1/health did not report database and redis both up")
              raise SystemExit(1)
          PY

      - name: Assert the schema is at the single migration head
        # The migration chain is folded into one revision (0001_initial). Asserting a SINGLE
        # head catches both an un-fold and a new revision landing without the baseline being
        # regenerated; asserting `current` is that head catches a migrate one-shot that
        # "succeeded" without actually stamping the database.
        run: |
          docker compose exec -T api alembic heads > "$RUNNER_TEMP/alembic-heads.txt"
          docker compose exec -T api alembic current > "$RUNNER_TEMP/alembic-current.txt"
          heads="$(tr -d '\r' < "$RUNNER_TEMP/alembic-heads.txt" | sed '/^[[:space:]]*$/d')"
          current="$(tr -d '\r' < "$RUNNER_TEMP/alembic-current.txt" | sed '/^[[:space:]]*$/d')"
          printf 'alembic heads:   %s\n' "$heads"
          printf 'alembic current: %s\n' "$current"
          if [ "$(printf '%s\n' "$heads" | wc -l)" -ne 1 ]; then
            echo "::error::Expected exactly ONE alembic head; got: ${heads}"
            exit 1
          fi
          case "$heads" in
            "0001_initial "*"(head)") ;;
            *) echo "::error::Expected the single head to be 0001_initial; got: ${heads}"; exit 1 ;;
          esac
          case "$current" in
            "0001_initial "*"(head)") ;;
            *) echo "::error::The database is not stamped at head 0001_initial; got: ${current}"; exit 1 ;;
          esac

      - name: Assert the bootstrap admin can sign in and call an authenticated endpoint
        # Proves the account the installer created is usable over HTTP end to end: the
        # password hash verifies, the org membership exists, and the JWT is accepted.
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          api = os.environ["API_BASE"]
          email = os.environ["ADMIN_EMAIL"]


          def call(path, *, payload=None, token=None):
              headers, data = {}, None
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["Content-Type"] = "application/json"
              if token is not None:
                  headers["Authorization"] = f"Bearer {token}"
              request = urllib.request.Request(api + path, data=data, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=20) as resp:
                      return resp.status, json.load(resp)
              except urllib.error.HTTPError as exc:
                  return exc.code, None


          status, tokens = call(
              "/auth/login", payload={"email": email, "password": os.environ["ADMIN_PASSWORD"]}
          )
          if status != 200 or not tokens:
              print(
                  f"::error::The bootstrapped admin could not sign in (HTTP {status}). A 401 means "
                  "ADMIN_PASSWORD did not reach bootstrap_admin (.env -> api container) and a "
                  "random password was generated instead"
              )
              raise SystemExit(1)

          status, me = call("/users/me", token=tokens["access_token"])
          if status != 200 or not me:
              print(f"::error::GET /users/me with the admin session failed (HTTP {status})")
              raise SystemExit(1)
          if me["user"]["email"] != email or me["role"] != "owner":
              print("::error::The bootstrapped account is not the OWNER of its organization")
              raise SystemExit(1)
          print(f"Signed in as {me['user']['email']} (role={me['role']}, org={me['active_org']['name']})")
          PY

      - name: Assert self-serve signup stays closed in production
        # Regression test, not a smoke test: the prod topology forces ENVIRONMENT=production,
        # where SIGNUP_ENABLED must default closed. An open register endpoint on a keyed
        # instance lets a stranger create an org and spend the operator's provider keys.
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          request = urllib.request.Request(
              os.environ["API_BASE"] + "/auth/register",
              data=json.dumps(
                  {
                      "email": "stranger@example.com",
                      "password": "a-schema-valid-password",
                      "full_name": "Stranger",
                      "org_name": "Stranger Co",
                  }
              ).encode(),
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as resp:
                  code = resp.status
          except urllib.error.HTTPError as exc:
              code = exc.code
          print(f"POST /auth/register -> HTTP {code}")
          if code != 403:
              print(
                  f"::error::Anonymous POST /auth/register returned HTTP {code}, expected 403 - "
                  "self-serve signup must stay closed on a production self-host"
              )
              raise SystemExit(1)
          PY

      - name: Assert the web container serves the dashboard
        run: |
          echo "Polling ${WEB_BASE} ..."
          for i in $(seq 1 30); do
            code="$(curl -fsS -o /dev/null -w '%{http_code}' "$WEB_BASE" || true)"
            echo "attempt $i: HTTP ${code:-000}"
            if [ "$code" = "200" ]; then
              echo "Web is up."
              exit 0
            fi
            sleep 5
          done
          echo "::error::The web container never answered on ${WEB_BASE}"
          exit 1

      - name: Assert re-running the installer is idempotent
        # A second `make selfhost` is what an operator runs to upgrade. Rotating SECRET_KEY
        # would orphan every Fernet-encrypted connector secret; rotating POSTGRES_PASSWORD
        # would lock the app out of its own volume. Compare digests, never the values.
        run: |
          set -o pipefail  # `tee` would otherwise mask a non-zero exit from the script
          before="$(grep -E '^(SECRET_KEY|POSTGRES_PASSWORD)=' .env | sha256sum)"
          ./scripts/selfhost-init.sh 2>&1 | tee "$RUNNER_TEMP/selfhost-rerun.log"
          after="$(grep -E '^(SECRET_KEY|POSTGRES_PASSWORD)=' .env | sha256sum)"
          if [ "$before" != "$after" ]; then
            echo "::error::Re-running scripts/selfhost-init.sh rotated SECRET_KEY and/or POSTGRES_PASSWORD"
            exit 1
          fi
          if ! grep -q 'already bootstrapped' "$RUNNER_TEMP/selfhost-rerun.log"; then
            echo "::error::The second run did not detect the existing admin - the bootstrap is not idempotent"
            exit 1
          fi
          echo "Second run left SECRET_KEY and POSTGRES_PASSWORD untouched."

      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color api migrate worker web

      - name: Tear down
        if: always()
        run: docker compose down -v
