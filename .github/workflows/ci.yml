name: CI

# Quality gates for Third Brain. On every push/PR we:
#   * lint + format-check the backend and the Next.js frontend,
#   * run the FULL pytest suite (unit + integration) against a REAL
#     Postgres 16 + pgvector and REAL Redis after `alembic upgrade head`
#     - this job is the AUTHORITATIVE test gate,
#   * build the api + web Docker images to catch Dockerfile regressions, and
#   * drive the whole docker-compose stack through Playwright end-to-end.
#
# There is intentionally NO hermetic / SQLite / mock tier: the real-infra
# job below is the single source of truth for correctness.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------- #
  # Version consistency: every version literal (VERSION, __init__.py,
  # package.json, ROADMAP) must agree - the release workflow depends on it.
  # --------------------------------------------------------------------------- #
  version-sync:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check version literals are in sync
        run: ./scripts/check_version_sync.sh

  # --------------------------------------------------------------------------- #
  # Backend lint: ruff check + ruff format --check (matches `make lint`/`make fmt`).
  # --------------------------------------------------------------------------- #
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

  # --------------------------------------------------------------------------- #
  # Backend tests (AUTHORITATIVE): real Postgres+pgvector + real Redis.
  # Unit + integration both run here; integration tests self-skip only when the
  # env vars are absent, so on CI (where they ARE set) they MUST execute.
  # --------------------------------------------------------------------------- #
  backend-tests:
    name: Backend tests (pgvector + redis)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: thirdbrain
          POSTGRES_PASSWORD: thirdbrain
          POSTGRES_DB: thirdbrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thirdbrain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # `DATABASE_URL` drives BOTH the app engine and `alembic upgrade head`
      # (alembic swaps +asyncpg -> +psycopg internally). The TEST_* aliases are
      # what the test conftest resolves against (TEST_* or plain).
      DATABASE_URL: postgresql+asyncpg://thirdbrain:thirdbrain@localhost:5432/thirdbrain
      TEST_DATABASE_URL: postgresql+asyncpg://thirdbrain:thirdbrain@localhost:5432/thirdbrain
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/0
      # Force the deterministic offline LLM provider - tests never hit a network.
      EMBEDDING_PROVIDER: fake
      SECRET_KEY: ci-test-secret-key-not-for-production
      ENVIRONMENT: development
      # Infra IS provided here, so the integration tier must RUN, not self-skip: make the
      # reachability gate fail (not skip) if Postgres/Redis are unreachable, so a probe
      # regression can't silently turn this authoritative job into unit-tests-only.
      REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Verify migrations are reversible (downgrade base -> upgrade head)
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Run tests (unit + integration) with coverage
        run: pytest -q --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: apps/api/coverage.xml
          if-no-files-found: warn

  # --------------------------------------------------------------------------- #
  # Frontend: install, lint, format-check and production-build the Next.js app.
  # --------------------------------------------------------------------------- #
  frontend:
    name: Frontend (lint + format + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Build
        run: npm run build

  # --------------------------------------------------------------------------- #
  # MCP CLI: lint + unit-test the zero-dependency third-brain-mcp package.
  # --------------------------------------------------------------------------- #
  mcp-cli:
    name: MCP CLI (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/mcp-cli
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/mcp-cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # --------------------------------------------------------------------------- #
  # Docker images: buildx-build the api + web images to catch Dockerfile drift.
  # --------------------------------------------------------------------------- #
  docker-build:
    name: Docker build (api + web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Validate prod compose image interpolation
        # The release workflow publishes ${IMAGE_REGISTRY}/third-brain-*:${IMAGE_TAG};
        # make sure docker-compose.prod.yml resolves those refs correctly both with
        # and without a registry prefix (and never emits a leading-slash artifact).
        run: |
          cp .env.example .env
          plain="$(docker compose -f docker-compose.prod.yml config --images)"
          if ! echo "$plain" | grep -qxF 'third-brain-api:latest' \
            || ! echo "$plain" | grep -qxF 'third-brain-web:latest' \
            || echo "$plain" | grep -q '^/'; then
            echo "::error::Unexpected image refs with IMAGE_REGISTRY unset"
            echo "$plain"
            exit 1
          fi
          tagged="$(IMAGE_REGISTRY=ghcr.io/km322 IMAGE_TAG=v9.9.9 docker compose -f docker-compose.prod.yml config --images)"
          if ! echo "$tagged" | grep -qxF 'ghcr.io/km322/third-brain-api:v9.9.9' \
            || ! echo "$tagged" | grep -qxF 'ghcr.io/km322/third-brain-web:v9.9.9'; then
            echo "::error::Unexpected image refs with IMAGE_REGISTRY=ghcr.io/km322 IMAGE_TAG=v9.9.9"
            echo "$tagged"
            exit 1
          fi
          rm -f .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: false
          load: false
          tags: third-brain-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: false
          load: false
          tags: third-brain-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # --------------------------------------------------------------------------- #
  # End-to-end: boot the real docker-compose stack and drive it with Playwright.
  # --------------------------------------------------------------------------- #
  e2e:
    name: E2E (compose + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-lint, frontend]
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      # The data-sources journey creates a local folder on the runner and points the
      # containerised connector at it, so it must resolve to the same absolute path on
      # both sides. This dir is bind-mounted into api + worker by docker-compose.e2e.yml.
      E2E_DATA_DIR: /tmp/tb-e2e-data
      # Make every `docker compose` invocation in this job apply the e2e overlay.
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v7

      - name: Provision .env
        run: cp .env.example .env

      # Install the runner-side Playwright toolchain BEFORE starting the stack. The dev
      # compose bind-mounts ./apps/web with an anonymous node_modules volume, so
      # `docker compose up` would otherwise create apps/web/node_modules on the host as
      # root (the volume mountpoint), and the subsequent `npm ci` would fail with EACCES.
      # Creating node_modules here first (owned by the runner) means Docker mounts onto the
      # existing directory instead of creating a root-owned one.
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Create the shared data-source directory
        # World-writable so both the runner (writing test files) and the appuser (uid
        # 10001) inside the containers (reading them) can use it.
        run: mkdir -p "$E2E_DATA_DIR" && chmod 777 "$E2E_DATA_DIR"

      - name: Build and start the full stack
        run: docker compose up -d --build

      - name: Wait for the API to report healthy
        run: |
          echo "Polling http://localhost:8000/api/v1/health ..."
          for i in $(seq 1 60); do
            body="$(curl -fsS http://localhost:8000/api/v1/health || true)"
            echo "attempt $i: ${body:-<no response>}"
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "API is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "::error::API did not become healthy in time"
          exit 1

      - name: Apply database migrations
        # The dev compose stack has no migrate one-shot and the app never
        # auto-creates the schema, so migrate the freshly-started DB before the
        # Playwright journeys (signup, etc.) write to it. Mirrors `make migrate`.
        run: docker compose exec -T api alembic upgrade head

      - name: Wait for the web app to answer
        run: |
          echo "Polling http://localhost:3000 ..."
          for i in $(seq 1 60); do
            code="$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:3000 || true)"
            echo "attempt $i: HTTP ${code:-000}"
            if [ "$code" = "200" ]; then
              echo "Web is up."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Web app did not become reachable in time"
          exit 1

      - name: Run Playwright end-to-end tests
        working-directory: apps/web
        run: npm run test:e2e

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v
