# Automated dependency updates for every manifest in the monorepo.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Every label named below must exist in the repository. Dependabot does not create labels:
# when one is missing it applies none of them and comments "The following labels could not
# be found" on every pull request it opens. The set in use here is `dependencies`, plus one
# of `backend` / `frontend`, plus `docker` or `ci` where the ecosystem is one of those.
#
# Every ecosystem has a 7-day cooldown: a version is only proposed once it has been public
# for a week. Hijacked releases (npm worms, compromised maintainer tokens, retagged actions)
# are usually caught and pulled within days, so this keeps them out of the lockfiles. Security
# updates are not delayed - Dependabot exempts them from the cooldown.
version: 2
updates:
  # ---- Backend API (Python / pip via pyproject.toml) ----------------------- #
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---- Frontend web app (npm) --------------------------------------------- #
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # These majors are pinned by something else in this repo, so bumping any one of them on
    # its own is wrong rather than merely unreviewed. Minor and patch still flow.
    ignore:
      # @types/node types the runtime, so it tracks the runtime: the web Dockerfile is
      # node:22-alpine and CI runs Node 22. A newer major would type APIs that do not
      # exist where this code runs - `tsc` passes, the call throws. Move it in the same
      # change that moves the Dockerfile and the CI matrix.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The lint toolchain moves as one unit, with Next, by hand. eslint-config-next ships
      # with Next and is versioned with it, and it is what pins the other two:
      #   * eslint-plugin-react, eslint-plugin-import and eslint-plugin-jsx-a11y (its
      #     dependencies) peer at `eslint ^9`. eslint-config-next 16.4 shims the context
      #     APIs ESLint 10 removed, so a forced ESLint 10 now lints cleanly, but npm only
      #     installs it by overriding all three peer ranges (ERESOLVE warnings). Take it
      #     when those plugins declare ESLint 10 support;
      #   * typescript-eslint (its dependency) peers at `typescript <6.1`, so TypeScript 7
      #     fails the lint job with "typescript-eslint does not support TS 7.0".
      # A new eslint-config-next major also brings whatever new rules its plugins enable
      # by default, as 16 did with eslint-plugin-react-hooks 7's React Compiler rules, and
      # those are a reviewed change of their own.
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # tailwind-merge tracks the Tailwind major, and this app is on tailwindcss 3. v3 supports
      # only Tailwind v4 ("if you use Tailwind v3, use tailwind-merge v2.6.0", per its README),
      # so it builds and passes CI green while merging some v3 classes wrongly: v2 resolves
      # `outline-none outline` to `outline`, v3 keeps both. Move it with tailwindcss 4.
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]

  # ---- Container base images ---------------------------------------------- #
  # The images every self-hoster pulls. Without these, a CVE in python:3.11-slim or
  # node:22-alpine produces no signal in this repo.
  #
  # Patch and minor only. A major base-image bump is a decision, not an update: CI pins
  # Python 3.11 and Node 22, so moving the runtime without moving the test matrix ships
  # an interpreter the 766-test suite has never run against. Raise the language version
  # in CI and the Dockerfile together, by hand.
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend", "docker"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Python's language version is its minor: 3.11 -> 3.14 (proposed in #11) is the runtime
      # change described above, but Dependabot reads it as a minor update, which the major-only
      # rule does not catch. `3.11-slim` floats, so every image build already takes the newest
      # 3.11 patch and nothing is lost by ignoring it here.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend", "docker"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---- GitHub Actions workflows ------------------------------------------- #
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
