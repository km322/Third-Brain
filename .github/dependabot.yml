# Automated dependency updates for every manifest in the monorepo.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Every label named below must exist in the repository. Dependabot does not create labels:
# when one is missing it applies none of them and comments "The following labels could not
# be found" on every pull request it opens. The set in use here is `dependencies`, plus one
# of `backend` / `frontend`, plus `docker` or `ci` where the ecosystem is one of those.
version: 2
updates:
  # ---- Backend API (Python / pip via pyproject.toml) ----------------------- #
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---- Frontend web app (npm) --------------------------------------------- #
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Two packages are pinned to something else in this repo and a major bump of either,
    # on its own, is wrong rather than merely unreviewed. Minor and patch still flow.
    ignore:
      # @types/node types the runtime, so it tracks the runtime: the web Dockerfile is
      # node:22-alpine and CI runs Node 22. A newer major would type APIs that do not
      # exist where this code runs - `tsc` passes, the call throws. Move it in the same
      # change that moves the Dockerfile and the CI matrix.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-config-next ships with Next and is versioned with it, so it moves when
      # `next` moves. Its majors also carry the lint stack: v16 requires ESLint >= 9 and
      # flat config, and pulls eslint-plugin-react-hooks 7, whose React Compiler rules
      # are a reviewed change of their own.
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]

  # ---- Container base images ---------------------------------------------- #
  # The images every self-hoster pulls. Without these, a CVE in python:3.11-slim or
  # node:22-alpine produces no signal in this repo.
  #
  # Patch and minor only. A major base-image bump is a decision, not an update: CI pins
  # Python 3.11 and Node 22, so moving the runtime without moving the test matrix ships
  # an interpreter the 766-test suite has never run against. Raise the language version
  # in CI and the Dockerfile together, by hand.
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend", "docker"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend", "docker"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---- GitHub Actions workflows ------------------------------------------- #
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
